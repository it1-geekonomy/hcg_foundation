upstream hcg_frontend {
    server frontend:3000;
}

upstream hcg_backend {
    server backend:6060;
}

# Issued by certbot (see DEPLOY.md); nginx will not start until these files exist.
ssl_certificate     /etc/letsencrypt/live/hcgfoundation.org/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/hcgfoundation.org/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

# Plain HTTP: certificate challenges only; everything else moves to the HTTPS www site.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.hcgfoundation.org$request_uri;
    }
}

# deploy.sh health checks (curl http://localhost/...) run on the server itself.
server {
    listen 80;
    server_name localhost 127.0.0.1;

    include /etc/nginx/conf.d/hcg-proxy.inc;
}

# The bare domain and the droplet IP redirect to the canonical www address.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    return 301 https://www.hcgfoundation.org$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.hcgfoundation.org;

    include /etc/nginx/conf.d/hcg-proxy.inc;
}
